AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS CloudFormation Stack for Document Intelligence API and Web Platform'

Parameters:
  EnvironmentName:
    Type: String
    Default: Production
    Description: Environment name

Resources:
  DocumentStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  BackendECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: doc-intel-backend

  FrontendECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: doc-intel-frontend

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${EnvironmentName}-DocIntelCluster'

Outputs:
  BucketName:
    Value: !Ref DocumentStorageBucket
    Description: S3 Storage Bucket
  ClusterName:
    Value: !Ref ECSCluster
    Description: ECS Cluster Name
